rubrics:
  - id: 1
    type: f2p
    text: 需要持久化的批次只有在安全事件、访问日志和应有报文层全部成功后才被确认释放，正常写入后的日志可按既有查询路径完整读取。
  - id: 2
    type: f2p
    text: 日志数据库发生可恢复写入失败时，未确认日志不会从系统所有权中消失，并在数据库恢复后受控重试成功且不产生忙循环。
  - id: 3
    type: f2p
    text: 三层持久化部分成功时，恢复只补齐同一请求标识下缺失的层，已成功的行不重复且最终不会留下永久分裂的日志记录。
  - id: 4
    type: f2p
    text: 有序关闭会先停止新的日志生产并排空已接收批次，关闭完成前日志已确认持久化，持续失败会留下可观察结果而非固定等待后静默丢失。
  - id: 5
    type: f2p
    text: 进程在批次持久化前后意外退出时，下一次启动会继续处理未确认工作而不重放已完成日志，恢复完成后可继续接收新日志。
  - id: 6
    type: f2p
    text: 数据库重试、关闭排空和重启恢复不会重复增加 IP 失败计数、流量或分析统计，也不会重复投递 Kafka 与文件日志出口。
  - id: 7
    type: p2p
    text: 日志持久化关闭时保持现有非落库行为，负样本蓄水池仍按原采样语义运行，正常批处理吞吐、SQLite、MySQL、PostgreSQL 和日志查询不回归。
